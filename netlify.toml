[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Netlify detects Next.js automatically and runs its own Next.js runtime, so
# there is no plugin to install. This file only pins the build command, output
# directory and Node major version. See README.md for deployment notes.

# STAGING ONLY — this deploy is a blank template on a preview subdomain, so it
# must not show up in search results. REMOVE THIS BLOCK when the rewrite
# actually launches, together with app/robots.ts and the `robots` field in
# app/layout.tsx.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
